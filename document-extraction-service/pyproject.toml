[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "document-extraction-service"
version = "0.1.0"
description = "Document extraction microservice - extracts structured content from DOCX, PDF, PPTX, XLSX, HTML, CSV"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.7",
    "PyMuPDF>=1.25",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "langdetect>=1.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3",
    "pdf2image>=1.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
